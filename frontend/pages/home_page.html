        <label for="search">Sök produkt:</label>

        <label for="supplier">Välj leverantör:</label>

            <option value="2">NordSupply</option>
        </select><br><br>

        <input type="submit" value="Filtrera">
    </form>

    <hr>
    <!-- PRODUKTLISTA -->
    <h2>Produkter</h2>
    <tbody id="tableBody"></tbody>>
    <table border="1" id="productTable">
        <tr>
            <th>Namn</th>
            <th>Pris</th>
            <th>Lager</th>
            <th>Leverantör</th>
            <th></th>
        </tr>
        <tbody id="tableBody"></tbody>
    </table>
    <script src="script.js"></script>
    <script>
        loadProducts();
    </script>
