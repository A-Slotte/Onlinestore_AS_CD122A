<!DOCTYPE html>
<html lang="sv">
<h2>Sign up</h2>
<body>
    <form>
        <label for="f_name">Firstname:</label><br>
        <input type="f_name" id="f_name" name="f_name"><br><br>

        <label for="l_name">Lastname:</label><br>
        <input type="l_name" id="l_name" name="l_name"><br><br>

        <label for="tel">Phone number:</label><br>
        <input type="tel" id="tel" name="tel"><br><br>

        <label for="email">E-post:</label><br>
        <input type="email" id="email" name="email"><br><br>

        <label for="address">Address:</label><br>
        <input type="address" id="address" name="adress"><br><br>

        <label for="city">City:</label><br>
        <input type="city" id="city" name="city"><br><br>

        <label for="password">Lösenord:</label><br>
        <input type="password" id="password" name="password"><br><br>

        <input type="button" value="Sign Up" onclick="signUp()">
        

    </form>
    <script src="script.js"></script>
</body>
